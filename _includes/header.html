<header class="site-header">
	<div class="site-header__inner">
		<a href="{{ '/' | relative_url }}" class="site-header__brand">
			<img src="{{ '/favicon-32x32.png' | relative_url }}" alt="" width="24" height="24" />
			<span>{{ site.title }}</span>
		</a>

		<nav class="site-nav" aria-label="Primary">
			{% assign section = page.url | split: '/' | slice: 1 | first %}
			<a href="{{ '/blog/' | relative_url }}" class="site-nav__link"{% if section == 'blog' %} aria-current="page"{% endif %}>Blog</a>
			<a href="{{ '/projects/' | relative_url }}" class="site-nav__link"{% if section == 'projects' %} aria-current="page"{% endif %}>Projects</a>
			<a href="{{ '/about/' | relative_url }}" class="site-nav__link"{% if section == 'about' %} aria-current="page"{% endif %}>About</a>

			<button type="button" class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" title="Toggle dark mode">
				<svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
				<svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
			</button>
		</nav>
	</div>
</header>
