<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
	<meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)" />

	<!-- Apply the saved theme before first paint to avoid a flash -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
			} catch (e) {}
		})();
	</script>

	{% seo %}
	{% feed_meta %}

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}" />
	<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any" />
	<link rel="icon" href="{{ '/favicon-32x32.png' | relative_url }}" type="image/png" />
	<script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
</head>
